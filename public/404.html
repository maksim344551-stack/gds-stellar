<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#08080a" />
  <title>Страница не найдена: GDS «Джедес»</title>
  <!-- Хостинг (statichost.eu) отдаёт этот файл на любой несуществующий адрес, в том числе вложенный, поэтому пути корневые (/), а не относительные.
       Стили встроены: страница не проходит через Vite, и хэшированные файлы сайта отсюда не подключить. Токены, шрифт и логотип общие с главной: /base.css. -->
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/base.css" />
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
  </style>
</head>
<body>
<main class="page">
  <a class="logo" href="/" aria-label="GDS, на главную"><span class="logo-mark" role="img" aria-label="GDS"></span></a>
  <p class="code">Ошибка 404</p>
  <h1>Страница не найдена</h1>
  <p>Такого адреса на сайте нет: возможно, ссылка устарела или в ней опечатка. На главной странице есть линейка вкусов, условия для партнёров и контакты.</p>
  <a class="btn" href="/">На главную</a>
</main>
</body>
</html>
